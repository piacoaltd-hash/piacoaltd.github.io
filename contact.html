<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Contact – PIACOA</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Inter, sans-serif;
background:#efefef;
display:flex;
align-items:center;
justify-content:center;
height:100vh;
}

/* FORM CONTAINER */

.form-container{
background:white;
padding:50px;
border-radius:6px;
box-shadow:0 10px 40px rgba(0,0,0,0.08);
width:420px;
max-width:90%;
text-align:center;
}

/* TITLE */

h1{
font-family:"Playfair Display", serif;
margin-bottom:25px;
font-size:28px;
}

/* INPUTS */

input, textarea{
width:100%;
padding:12px;
margin-bottom:15px;
border:1px solid #ddd;
border-radius:4px;
font-family:Inter;
font-size:14px;
}

textarea{
height:120px;
resize:vertical;
}

/* BUTTONS */

button{
background:#6c8a7c;
color:white;
border:none;
padding:12px 22px;
border-radius:4px;
cursor:pointer;
font-size:15px;
transition:0.3s;
}

button:hover{
background:#566f63;
}

.back-btn{
display:inline-block;
margin-top:20px;
background:#6c8a7c;
color:white;
padding:12px 22px;
text-decoration:none;
border-radius:4px;
transition:0.3s;
}

.back-btn:hover{
background:#566f63;
}

/* SUCCESS MESSAGE */

#success-message{
display:none;
color:#6c8a7c;
margin-top:15px;
font-size:14px;
}

</style>
</head>

<body>

<div class="form-container">

<h1>Contact PIACOA</h1>

<form action="https://formspree.io/f/mjgabaze" method="POST" onsubmit="showMessage()">

<input type="text" name="name" placeholder="Your Name" required>

<input type="email" name="email" placeholder="Your Email" required>

<textarea name="message" placeholder="Your Message" required></textarea>

<button type="submit">Send</button>

</form>

<p id="success-message">Message successfully sent</p>

<a href="index.html" class="back-btn">Back to Website</a>

</div>

<script>

function showMessage(){
setTimeout(function(){
document.getElementById("success-message").style.display="block";
},300);
}

</script>

</body>
</html>
